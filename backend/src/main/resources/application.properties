spring.application.name=agrosearch-backend
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8080}
spring.mvc.async.request-timeout=240000

integracao.connect-timeout=10s
integracao.response-timeout=30s
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:${FRONTEND_ALLOWED_ORIGIN:http://localhost:5173},https://appauma-tenley-accusably.ngrok-free.dev}

nominatim.search-url=https://nominatim.openstreetmap.org/search
nominatim.user-agent=${NOMINATIM_USER_AGENT:AgroSearch/1.0}

nasa.earthdata.username=${NASA_EARTHDATA_USERNAME:}
nasa.earthdata.password=${NASA_EARTHDATA_PASSWORD:}
nasa.appeears.task-timeout=${NASA_APPEEARS_TASK_TIMEOUT:900s}
nasa.tvdi.lst-min-c=${NASA_TVDI_LST_MIN_C:}
nasa.tvdi.coefficient-a-c=${NASA_TVDI_A_C:}
nasa.tvdi.coefficient-b-c=${NASA_TVDI_B_C:}

copernicus.client-id=${COPERNICUS_CLIENT_ID:}
copernicus.client-secret=${COPERNICUS_CLIENT_SECRET:}
