spring.application.name=searchagro-backend

# Nominatim Geocoding API
nominatim.search-url=https://nominatim.openstreetmap.org/search
nominatim.user-agent=${NOMINATIM_USER_AGENT:SearchAgro/0.0.1 (contato: agro@searchagro.com)}
nominatim.connect-timeout=5s
nominatim.response-timeout=10s
nominatim.request-interval=1s
nominatim.cache-ttl=5m

# ISRIC SoilGrids REST API v2.0
soilgrids.query-url=https://rest.isric.org/soilgrids/v2.0/properties/query
soilgrids.connect-timeout=5s
soilgrids.response-timeout=10s
